<!-- FIREBASE SDKs (TEMPO REAL E NUVEM) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

    // 🟢 SUAS CHAVES REAIS DO PROJETO MAJU ENXOVAIS
    const firebaseConfig = {
      apiKey: "AIzaSyDl1gUSxd2v3iirh4Eozs9KibkQ6M_NcIc",
      authDomain: "maju-enxovais.firebaseapp.com",
      projectId: "maju-enxovais",
      storageBucket: "maju-enxovais.firebasestorage.app",
      messagingSenderId: "397338285103",
      appId: "1:397338285103:web:d76f389f34e8bc6c4b22da",
      measurementId: "G-991NH0S2Q1"
    };

    // Inicialização do Firebase e Firestore
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    let senhaGestor = localStorage.getItem('maju_senha_gestor') || "1234";
    let modoGestorAtivo = false;

    window.operadores = [];
    window.maquinasObj = [];
    window.apontamentos = [];
    window.apontamentosFiltradosAtuais = [];
    window.resumoOperadoresAtuais = [];

    // SINCRONIZAÇÃO EM TEMPO REAL COM FIRESTORE
    onSnapshot(collection(db, "operadores"), (snapshot) => {
      window.operadores = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      carregarSelects();
      renderCadastros();
    });

    onSnapshot(collection(db, "maquinas"), (snapshot) => {
      window.maquinasObj = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      carregarSelects();
      renderCadastros();
    });

    onSnapshot(collection(db, "apontamentos"), (snapshot) => {
      window.apontamentos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderApontamentosHoje();
      filtrarRelatorio();
    });

    window.onload = function() {
      const hoje = new Date().toISOString().slice(0, 10);
      const elIni = document.getElementById('rel-data-ini');
      const elFim = document.getElementById('rel-data-fim');
      const elHoje = document.getElementById('lbl-data-hoje');

      if(elIni) elIni.value = hoje;
      if(elFim) elFim.value = hoje;
      if(elHoje) elHoje.innerText = new Date().toLocaleDateString('pt-BR');

      definirDataHoraAtual();
      atualizarInterfaceModo();
    };

    window.toggleModoGestor = function() {
      if(modoGestorAtivo) {
        modoGestorAtivo = false;
        alert("Sessão de Gestor encerrada.");
      } else {
        const pass = prompt("Digite a Senha de Gestor para acessar dados financeiros:");
        if(pass === senhaGestor) {
          modoGestorAtivo = true;
          alert("Acesso de Gestor ativado!");
        } else if(pass !== null) {
          alert("Senha incorreta!");
        }
      }
      atualizarInterfaceModo();
      filtrarRelatorio();
      renderCadastros();
    };

    function atualizarInterfaceModo() {
      const btn = document.getElementById('btn-gestor');
      const st = document.getElementById('status-modo');
      const camposGestor = document.getElementById('campos-premiação-gestor');
      const badgeLock = document.getElementById('badge-lock');

      if(modoGestorAtivo) {
        if(btn) {
          btn.innerText = "🔓 Gestor (Sair)";
          btn.className = "px-2.5 py-1.5 rounded-lg text-xs font-bold bg-emerald-600 text-white shadow";
        }
        if(st) {
          st.innerText = "Modo Gestor (Acesso Total)";
          st.className = "text-[10px] md:text-xs text-emerald-400 font-bold";
        }
        if(camposGestor) camposGestor.classList.remove('opacity-50', 'pointer-events-none');
        if(badgeLock) {
          badgeLock.innerText = "🔓 Liberação Ativa";
          badgeLock.className = "text-emerald-600 font-bold";
        }
      } else {
        if(btn) {
          btn.innerText = "🔒 Gestor";
          btn.className = "px-2.5 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-amber-400 border border-amber-500/30 hover:bg-slate-700";
        }
        if(st) {
          st.innerText = "Modo Operador (Valores Ocultos)";
          st.className = "text-[10px] md:text-xs text-amber-400";
        }
        if(camposGestor) camposGestor.classList.add('opacity-50', 'pointer-events-none');
        if(badgeLock) {
          badgeLock.innerText = "🔒 Requer Senha de Gestor";
          badgeLock.className = "text-red-500 font-bold";
        }
      }
    }

    function definirDataHoraAtual() {
      const agora = new Date();
      const ano = agora.getFullYear();
      const mes = String(agora.getMonth() + 1).padStart(2, '0');
      const dia = String(agora.getDate()).padStart(2, '0');
      const horas = String(agora.getHours()).padStart(2, '0');
      const minutos = String(agora.getMinutes()).padStart(2, '0');
      
      const elDt = document.getElementById('apt-datetime');
      if(elDt) elDt.value = `${ano}-${mes}-${dia}T${horas}:${minutos}`;
    }

    window.mudarAba = function(aba) {
      const secApt = document.getElementById('sec-apontamento');
      const secRel = document.getElementById('sec-relatorios');
      const secCad = document.getElementById('sec-cadastros');

      if(secApt) secApt.classList.toggle('hidden', aba !== 'apontamento');
      if(secRel) secRel.classList.toggle('hidden', aba !== 'relatorios');
      if(secCad) secCad.classList.toggle('hidden', aba !== 'cadastros');

      const tabApt = document.getElementById('tab-apontamento');
      const tabRel = document.getElementById('tab-relatorios');
      const tabCad = document.getElementById('tab-cadastros');

      if(tabApt) tabApt.className = aba === 'apontamento' ? "px-2.5 py-1.5 md:px-3 md:py-2 rounded-lg text-xs md:text-sm font-semibold bg-amber-500 text-slate-950" : "px-2.5 py-1.5 md:px-3 md:py-2 rounded-lg text-xs md:text-sm font-semibold text-slate-300 hover:bg-slate-800";
      if(tabRel) tabRel.className = aba === 'relatorios' ? "px-2.5 py-1.5 md:px-3 md:py-2 rounded-lg text-xs md:text-sm font-semibold bg-amber-500 text-slate-950" : "px-2.5 py-1.5 md:px-3 md:py-2 rounded-lg text-xs md:text-sm font-semibold text-slate-300 hover:bg-slate-800";
      if(tabCad) tabCad.className = aba === 'cadastros' ? "px-2.5 py-1.5 md:px-3 md:py-2 rounded-lg text-xs md:text-sm font-semibold bg-amber-500 text-slate-950" : "px-2.5 py-1.5 md:px-3 md:py-2 rounded-lg text-xs md:text-sm font-semibold text-slate-300 hover:bg-slate-800";

      if(aba === 'apontamento') definirDataHoraAtual();
      if(aba === 'relatorios') filtrarRelatorio();
    };

    function carregarSelects() {
      const selMaq = document.getElementById('apt-maquina');
      const selOp1 = document.getElementById('apt-op1');
      const selOp2 = document.getElementById('apt-op2');
      const selFiltroMaq = document.getElementById('rel-filtro-maquina');
      const selFiltroOp = document.getElementById('rel-filtro-operador');

      if(selMaq) selMaq.innerHTML = window.maquinasObj.map(m => `<option value="${m.nome}">${m.nome}</option>`).join('');
      if(selOp1) selOp1.innerHTML = window.operadores.map(o => `<option value="${o.nome}">${o.nome}</option>`).join('');
      if(selOp2) selOp2.innerHTML = '<option value="">-- Sem Dupla --</option>' + window.operadores.map(o => `<option value="${o.nome}">${o.nome}</option>`).join('');

      if(selFiltroMaq) selFiltroMaq.innerHTML = '<option value="">Todas as Máquinas</option>' + window.maquinasObj.map(m => `<option value="${m.nome}">${m.nome}</option>`).join('');
      if(selFiltroOp) selFiltroOp.innerHTML = '<option value="">Todos os Operadores</option>' + window.operadores.map(o => `<option value="${o.nome}">${o.nome}</option>`).join('');
    }

    window.salvarApontamento = async function(e) {
      e.preventDefault();
      
      const dtInput = document.getElementById('apt-datetime').value;
      const dataHora = dtInput ? new Date(dtInput).toISOString() : new Date().toISOString();

      const novo = {
        data: dataHora,
        maquina: document.getElementById('apt-maquina').value,
        op1: document.getElementById('apt-op1').value,
        op2: document.getElementById('apt-op2').value,
        produto: document.getElementById('apt-produto').value,
        qtd: parseInt(document.getElementById('apt-qtd').value),
        refugo: parseInt(document.getElementById('apt-refugo').value)
      };
      
      await addDoc(collection(db, "apontamentos"), novo);
      
      document.getElementById('apt-produto').value = '';
      document.getElementById('apt-qtd').value = '';
      document.getElementById('apt-refugo').value = '0';
      definirDataHoraAtual();
      
      alert('Apontamento salvo na nuvem com sucesso!');
    };

    function renderApontamentosHoje() {
      const hojeStr = new Date().toISOString().slice(0,10);
      const doHoje = window.apontamentos.filter(a => a.data.startsWith(hojeStr));
      
      let totOk = 0, totRef = 0;
      doHoje.forEach(a => { totOk += a.qtd; totRef += a.refugo; });

      const elOk = document.getElementById('hoje-total-ok');
      const elRef = document.getElementById('hoje-total-ref');
      const elReg = document.getElementById('hoje-total-registros');
      const elEf = document.getElementById('hoje-eficiencia');

      if(elOk) elOk.innerText = totOk;
      if(elRef) elRef.innerText = totRef;
      if(elReg) elReg.innerText = doHoje.length;

      const totalGeral = totOk + totRef;
      const ef = totalGeral > 0 ? ((totOk / totalGeral) * 100).toFixed(1) : 100;
      if(elEf) elEf.innerText = `${ef}%`;

      const tbody = document.getElementById('tb-hoje');
      if(!tbody) return;

      if(doHoje.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-4 text-center text-slate-400">Nenhum apontamento realizado hoje.</td></tr>';
        return;
      }

      tbody.innerHTML = doHoje.map(a => `
        <tr>
          <td class="p-2 md:p-3 text-slate-500">${new Date(a.data).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</td>
          <td class="p-2 md:p-3 font-semibold">${a.maquina}</td>
          <td class="p-2 md:p-3">${a.op1} ${a.op2 ? '/ ' + a.op2 : ''}</td>
          <td class="p-2 md:p-3">${a.produto}</td>
          <td class="p-2 md:p-3 text-center font-bold text-indigo-700">${a.qtd}</td>
          <td class="p-2 md:p-3 text-center font-bold text-red-600">${a.refugo}</td>
          <td class="p-2 md:p-3 text-right">
            <button onclick="deletarApontamento('${a.id}')" class="text-red-600 font-bold text-xs hover:underline">Excluir</button>
          </td>
        </tr>
      `).join('');
    }

    window.deletarApontamento = async function(id) {
      if(confirm('Tem certeza que deseja apagar este apontamento da nuvem?')) {
        await deleteDoc(doc(db, "apontamentos", id));
      }
    };

    function calcularPremio(nomeMaquina, qtdProduzida) {
      const maq = window.maquinasObj.find(m => m.nome === nomeMaquina);
      if(!maq) return { faixa: "Sem Meta", valor: 0 };

      let faixa = "Abaixo do Mínimo";
      let valor = 0;

      if(maq.f3_lim > 0 && qtdProduzida >= maq.f3_lim) {
        faixa = `Faixa 3 (>= ${maq.f3_lim})`;
        valor = maq.f3_val;
      } else if(maq.f2_lim > 0 && qtdProduzida >= maq.f2_lim) {
        faixa = `Faixa 2 (>= ${maq.f2_lim})`;
        valor = maq.f2_val;
      } else if(maq.f1_lim > 0 && qtdProduzida >= maq.f1_lim) {
        faixa = `Faixa 1 (>= ${maq.f1_lim})`;
        valor = maq.f1_val;
      }

      return { faixa, valor };
    }

    window.filtrarRelatorio = function() {
      const ini = document.getElementById('rel-data-ini')?.value;
      const fim = document.getElementById('rel-data-fim')?.value;
      const maqFiltro = document.getElementById('rel-filtro-maquina')?.value;
      const opFiltro = document.getElementById('rel-filtro-operador')?.value;

      const elPeriodo = document.getElementById('lbl-periodo');
      if(elPeriodo) {
        elPeriodo.innerText = `Período: ${ini ? new Date(ini+'T00:00:00').toLocaleDateString('pt-BR') : 'Início'} até ${fim ? new Date(fim+'T00:00:00').toLocaleDateString('pt-BR') : 'Fim'}`;
      }

      window.apontamentosFiltradosAtuais = window.apontamentos.filter(a => {
        const d = a.data.slice(0,10);
        if(ini && d < ini) return false;
        if(fim && d > fim) return false;
        if(maqFiltro && a.maquina !== maqFiltro) return false;
        if(opFiltro && a.op1 !== opFiltro && a.op2 !== opFiltro) return false;
        return true;
      });

      let totQtd = 0, totRef = 0;
      let agrupado = {};

      window.apontamentosFiltradosAtuais.forEach(f => { 
        totQtd += f.qtd; 
        totRef += f.refugo; 

        const chave1 = `${f.op1}||${f.maquina}`;
        if(!agrupado[chave1]) agrupado[chave1] = { operador: f.op1, maquina: f.maquina, qtd: 0, refugo: 0 };
        agrupado[chave1].qtd += f.qtd;
        agrupado[chave1].refugo += f.refugo;

        if(f.op2) {
          const chave2 = `${f.op2}||${f.maquina}`;
          if(!agrupado[chave2]) agrupado[chave2] = { operador: f.op2, maquina: f.maquina, qtd: 0, refugo: 0 };
          agrupado[chave2].qtd += f.qtd;
          agrupado[chave2].refugo += f.refugo;
        }
      });

      const cardTot = document.getElementById('card-total');
      const cardRef = document.getElementById('card-refugo');
      const cardEf = document.getElementById('card-eficiencia');

      if(cardTot) cardTot.innerText = totQtd;
      if(cardRef) cardRef.innerText = totRef;
      const totalGeral = totQtd + totRef;
      const ef = totalGeral > 0 ? ((totQtd / totalGeral) * 100).toFixed(1) : 100;
      if(cardEf) cardEf.innerText = `${ef}%`;

      window.resumoOperadoresAtuais = Object.values(agrupado).map(item => {
        const resPremio = calcularPremio(item.maquina, item.qtd);
        return {
          ...item,
          faixa: resPremio.faixa,
          premio: resPremio.valor
        };
      });

      let totalPremiosGeral = 0;
      const tbodyResumo = document.getElementById('tb-resumo-operadores');
      
      if(tbodyResumo) {
        if(window.resumoOperadoresAtuais.length === 0) {
          tbodyResumo.innerHTML = '<tr><td colspan="6" class="p-3 text-center text-slate-400">Nenhum operador com produção no período.</td></tr>';
        } else {
          tbodyResumo.innerHTML = window.resumoOperadoresAtuais.map(r => {
            totalPremiosGeral += r.premio;
            const textoPremio = modoGestorAtivo ? `R$ ${r.premio.toFixed(2)}` : '*** (Sigiloso)';
            return `
              <tr>
                <td class="p-2 md:p-3 font-semibold text-slate-800">${r.operador}</td>
                <td class="p-2 md:p-3 text-slate-600">${r.maquina}</td>
                <td class="p-2 md:p-3 text-center font-bold text-indigo-700">${r.qtd}</td>
                <td class="p-2 md:p-3 text-center font-bold text-red-600">${r.refugo}</td>
                <td class="p-2 md:p-3 text-center"><span class="bg-slate-100 text-slate-700 font-bold px-2 py-0.5 rounded text-xs">${r.faixa}</span></td>
                <td class="p-2 md:p-3 text-right font-black ${modoGestorAtivo ? 'text-emerald-700' : 'text-slate-400'}">${textoPremio}</td>
              </tr>
            `;
          }).join('');
        }
      }

      const cardPremio = document.getElementById('card-premio');
      if(cardPremio) cardPremio.innerText = modoGestorAtivo ? `R$ ${totalPremiosGeral.toFixed(2)}` : '***';

      // Tabela Detalhada
      const tbody = document.getElementById('tb-relatorio');
      if(!tbody) return;

      if(window.apontamentosFiltradosAtuais.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-4 text-center text-slate-400">Nenhum registro encontrado para este filtro.</td></tr>';
        return;
      }

      tbody.innerHTML = window.apontamentosFiltradosAtuais.map(a => `
        <tr>
          <td class="p-2 md:p-3 text-xs text-slate-500 border-r">${new Date(a.data).toLocaleDateString('pt-BR')} ${new Date(a.data).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</td>
          <td class="p-2 md:p-3 font-semibold border-r">${a.maquina}</td>
          <td class="p-2 md:p-3 border-r">${a.op1} ${a.op2 ? '/ ' + a.op2 : ''}</td>
          <td class="p-2 md:p-3 border-r">${a.produto}</td>
          <td class="p-2 md:p-3 text-center font-bold text-indigo-700 border-r">${a.qtd}</td>
          <td class="p-2 md:p-3 text-center font-bold text-red-600 border-r">${a.refugo}</td>
          <td class="p-2 md:p-3 text-right no-print">
            <button onclick="deletarApontamento('${a.id}')" class="text-red-600 font-bold text-xs hover:underline">Excluir</button>
          </td>
        </tr>
      `).join('');
    };

    window.exportarExcelOperadores = function() {
      if(!modoGestorAtivo) {
        if(!confirm("Apenas gestores podem exportar dados com valores financeiros. Deseja digitar a senha para prosseguir?")) return;
        const pass = prompt("Digite a Senha de Gestor:");
        if(pass === senhaGestor) {
          modoGestorAtivo = true;
          atualizarInterfaceModo();
        } else {
          alert("Senha incorreta!");
          return;
        }
      }

      if (window.resumoOperadoresAtuais.length === 0) {
        alert("Não há dados consolidados de operadores para exportar no período selecionado.");
        return;
      }
      let csvContent = "data:text/csv;charset=utf-8,Operador,Maquina,Qtd Produzida,Refugos,Faixa Atingida,Premio (R$)\n";
      window.resumoOperadoresAtuais.forEach(r => {
        csvContent += `"${r.operador}","${r.maquina}",${r.qtd},${r.refugo},"${r.faixa}",${r.premio.toFixed(2)}\n`;
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Producao_Premio_Operadores_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    window.imprimirRelatorio = function() { window.print(); };

    window.enviarWhatsApp = function() {
      const periodo = document.getElementById('lbl-periodo')?.innerText || '';
      const totQtd = document.getElementById('card-total')?.innerText || '0';
      const totRef = document.getElementById('card-refugo')?.innerText || '0';
      const ef = document.getElementById('card-eficiencia')?.innerText || '100%';

      let msg = `🏭 *MAJU ENXOVAIS - RELATÓRIO DE PRODUÇÃO*\n`;
      msg += `📌 *${periodo}*\n\n`;
      msg += `📊 *RESUMO CONSOLIDADO*\n`;
      msg += `✅ *Total Produzido:* ${totQtd} peças\n`;
      msg += `❌ *Total Refugos:* ${totRef} peças\n`;
      msg += `📈 *Eficiência:* ${ef}\n\n`;

      if(modoGestorAtivo) {
        const totPremio = document.getElementById('card-premio')?.innerText || 'R$ 0.00';
        msg += `💰 *Total Prêmios:* ${totPremio}\n\n`;
        msg += `🏆 *PRÊMIOS POR OPERADOR:*\n`;
        msg += `-----------------------------------\n`;
        window.resumoOperadoresAtuais.forEach((r) => {
          msg += `👤 *${r.operador}* (${r.maquina})\n`;
          msg += `📦 Qtd: ${r.qtd} | 🎖️ ${r.faixa}\n`;
          msg += `💵 Prêmio: *R$ ${r.premio.toFixed(2)}*\n`;
          msg += `-----------------------------------\n`;
        });
      } else {
        msg += `📋 *DETALHAMENTO DOS APONTAMENTOS:*\n`;
        msg += `-----------------------------------\n`;
        window.apontamentosFiltradosAtuais.forEach((a, index) => {
          const dt = new Date(a.data);
          const dataHoraStr = `${dt.toLocaleDateString('pt-BR')} ${dt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}`;
          const equipe = a.op2 ? `${a.op1} / ${a.op2}` : a.op1;
          
          msg += `*${index + 1}. ${a.produto}*\n`;
          msg += `🕒 ${dataHoraStr} | ⚙️ ${a.maquina}\n`;
          msg += `👤 Equipe: ${equipe}\n`;
          msg += `📦 Qtd OK: *${a.qtd}* | ⚠️ Refugo: *${a.refugo}*\n`;
          msg += `-----------------------------------\n`;
        });
      }

      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
    };

    // CADASTROS NO FIREBASE
    window.addOperador = async function(e) {
      e.preventDefault();
      const input = document.getElementById('cad-op-nome');
      const nome = input ? input.value.trim() : '';
      if(nome) {
        await addDoc(collection(db, "operadores"), { nome });
        if(input) input.value = '';
      }
    };

    window.deletarOperador = async function(id) {
      if (confirm(`Deseja remover este funcionário?`)) {
        await deleteDoc(doc(db, "operadores", id));
      }
    };

    window.addMaquina = async function(e) {
      e.preventDefault();
      const input = document.getElementById('cad-maq-nome');
      const nome = input ? input.value.trim() : '';
      
      let f1_lim = 0, f1_val = 0, f2_lim = 0, f2_val = 0, f3_lim = 0, f3_val = 0;

      if(modoGestorAtivo) {
        f1_lim = parseInt(document.getElementById('cad-maq-f1-lim')?.value) || 0;
        f1_val = parseFloat(document.getElementById('cad-maq-f1-val')?.value) || 0;
        f2_lim = parseInt(document.getElementById('cad-maq-f2-lim')?.value) || 0;
        f2_val = parseFloat(document.getElementById('cad-maq-f2-val')?.value) || 0;
        f3_lim = parseInt(document.getElementById('cad-maq-f3-lim')?.value) || 0;
        f3_val = parseFloat(document.getElementById('cad-maq-f3-val')?.value) || 0;
      }

      if(nome) {
        await addDoc(collection(db, "maquinas"), {
          nome, f1_lim, f1_val, f2_lim, f2_val, f3_lim, f3_val
        });
        
        if(input) input.value = '';
        if(modoGestorAtivo) {
          const el1 = document.getElementById('cad-maq-f1-lim'); if(el1) el1.value = '';
          const el2 = document.getElementById('cad-maq-f1-val'); if(el2) el2.value = '';
          const el3 = document.getElementById('cad-maq-f2-lim'); if(el3) el3.value = '';
          const el4 = document.getElementById('cad-maq-f2-val'); if(el4) el4.value = '';
          const el5 = document.getElementById('cad-maq-f3-lim'); if(el5) el5.value = '';
          const el6 = document.getElementById('cad-maq-f3-val'); if(el6) el6.value = '';
        }
      }
    };

    window.deletarMaquina = async function(id) {
      if (confirm(`Deseja remover esta máquina?`)) {
        await deleteDoc(doc(db, "maquinas", id));
      }
    };

    function renderCadastros() {
      const elOps = document.getElementById('lista-operadores');
      if(elOps) {
        elOps.innerHTML = window.operadores.map((o) => `
          <li class="py-2 flex justify-between items-center border-b last:border-0">
            <span class="font-medium text-slate-700">${o.nome}</span>
            <button onclick="deletarOperador('${o.id}')" class="text-red-600 font-bold text-xs hover:underline">Excluir</button>
          </li>
        `).join('');
      }

      const elMaqs = document.getElementById('lista-maquinas');
      if(elMaqs) {
        elMaqs.innerHTML = window.maquinasObj.map((m) => `
          <li class="py-3 border-b last:border-0 space-y-1">
            <div class="flex justify-between items-center">
              <span class="font-bold text-slate-800">${m.nome}</span>
              <button onclick="deletarMaquina('${m.id}')" class="text-red-600 font-bold text-xs hover:underline">Excluir</button>
            </div>
            <div class="text-[11px] text-slate-500 bg-slate-50 p-2 rounded">
              ${modoGestorAtivo ? 
                `F1: >= ${m.f1_lim} (R$ ${m.f1_val}) | F2: >= ${m.f2_lim} (R$ ${m.f2_val}) | F3: >= ${m.f3_lim} (R$ ${m.f3_val})` : 
                `<em>Regras financeiras ocultas (Modo Operador)</em>`
              }
            </div>
          </li>
        `).join('');
      }
    }
  </script>
